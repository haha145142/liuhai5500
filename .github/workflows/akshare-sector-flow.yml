name: AKShare Sector Flow Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/akshare-real-fallback
    paths:
      - ".github/workflows/akshare-sector-flow.yml"
      - "scripts/akshare-sector-flow.py"
  schedule:
    # China A-share session: 09:30-15:00 Asia/Shanghai (01:30-07:00 UTC).
    - cron: "*/10 1-7 * * 1-5"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AKShare
        run: python -m pip install --disable-pip-version-check --no-cache-dir "akshare>=1.17,<2"

      - name: Collect sector flow
        run: python scripts/akshare-sector-flow.py

      - name: Publish snapshot branch
        shell: bash
        run: |
          set -euo pipefail
          test -s data/akshare/sector-flow.json
          git fetch origin data/akshare:data/akshare
          cp data/akshare/sector-flow.json /tmp/sector-flow.json
          git checkout data/akshare
          mkdir -p data/akshare
          cp /tmp/sector-flow.json data/akshare/sector-flow.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/akshare/sector-flow.json
          if git diff --cached --quiet; then
            echo "No snapshot change; nothing to commit."
            exit 0
          fi
          git commit -m "data: refresh AKShare sector flow"
          git push origin HEAD:data/akshare
