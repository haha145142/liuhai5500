name: Vercel Production Deploy

# 生产部署改为手动触发，避免每次开发提交都消耗 Vercel 免费部署次数。
# 代码质量由独立 Quality Gate workflow 在 push/PR 上检查。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_wYwbhATp8xjwFAISgSMiUkok
      VERCEL_PROJECT_ID: prj_jhk3fRQlp3TEgRyr5cd0SzEX5ewO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel production
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
