name: Vercel Production Deploy

# Production is deployed by Vercel's native Git integration.
# Keep this workflow manual-only so a main push does not create a second deployment
# and consume another Hobby deployment slot.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
