name: Vercel Production Deploy

# Deploy production from main through GitHub Actions so a main push does not
# depend on Vercel's native Git webhook delivery. Quality checks remain in the
# separate Quality Gate workflow; they must not block a production deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_wYwbhATp8xjwFAISgSMiUkok
      VERCEL_PROJECT_ID: prj_jhk3fRQlp3TEgRyr5cd0SzEX5ewO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel production
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
