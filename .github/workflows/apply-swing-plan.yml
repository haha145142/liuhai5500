name: apply-swing-plan
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[swing-plan]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire swing plan into FundCard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/portfolio/FundCard.tsx')
          s=p.read_text()
          if 'from "@/components/portfolio/SwingPlan"' not in s:
              s=s.replace('import { useMemo, useState } from "react";', 'import { useMemo, useState } from "react";\nimport { SwingPlan } from "@/components/portfolio/SwingPlan";')
          marker='      {mapped ? (\n'
          insert='      <SwingPlan holding={holding} fund={fund} price={px} officialToday={officialToday} />\n\n'
          if insert.strip() not in s:
              s=s.replace(marker, insert+marker, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/apply-swing-plan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/portfolio/FundCard.tsx src/components/portfolio/SwingPlan.tsx .github/workflows/apply-swing-plan.yml
          git commit -m "feat: wire big swing trading plan [swing-plan]"
          git push
