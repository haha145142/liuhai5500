name: Build Goutoujunshi Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workflow smoke test
        run: |
          echo "Goutoujunshi APK builder is active"
          test -f .github/workflows/build-goutoujunshi-apk.yml
