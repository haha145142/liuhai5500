name: Fund AI Pro Preflight

on:
  push:
    branches:
      - "fix/**"
      - "feat/**"
      - "verify/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Deterministic tests
        run: node scripts/run-deterministic-tests.mjs
      - name: Runtime contract smoke
        run: npm run test:runtime
